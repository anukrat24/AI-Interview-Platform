services:
  db:
    image: postgres:16-alpine
    container_name: ai_interview_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_interview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ai_interview_pgdata:/var/lib/postgresql/data
      # Loads schema.sql automatically the FIRST time the volume is created.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_interview_pgdata:
