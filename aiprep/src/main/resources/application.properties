spring.application.name=ai-interview-platform

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_interview}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:anukrat}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Mail (OTP + notifications) via SendGrid Mail Send API ----
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:no-reply@aiprep.dev}
sendgrid.from-name=${SENDGRID_FROM_NAME:AI Interview Platform}

# ---- JWT ----
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- Gemini ----
gemini.api.key=${GEMINI_API_KEY:AIzaSyCyeAQbdU2ozNVehL0YbOZTlVgUytUQr-w}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-flash-latest

# ---- Google OAuth2 login ----
# Only active when the "oauth" profile is enabled (see application-oauth.properties).
# Without it, the app starts fine and simply has no Google login option.

# ---- Code execution (Piston public API - sandboxed, not run on our own server) ----
piston.base-url=${PISTON_BASE_URL:https://emkc.org/api/v2/piston}

# ---- Razorpay (payments) ----
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.premium-plan-amount-paise=${RAZORPAY_PREMIUM_AMOUNT_PAISE:49900}

# ---- Free tier limits ----
app.free-interviews-per-day=${FREE_INTERVIEWS_PER_DAY:3}

# ---- Cookies ----
# Keep default true for production (Render/Railway/Fly.io all serve HTTPS).
# Set COOKIE_SECURE=false only for local http://localhost testing.
app.cookie-secure=${COOKIE_SECURE:true}

# ---- Server ----
server.port=${PORT:8080}

# ---- File upload (resume PDFs) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Actuator (basic health check for hosting platforms) ----
management.endpoints.web.exposure.include=health
