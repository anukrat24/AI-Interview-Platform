# Activate this profile (spring.profiles.active=oauth) once you've created a Google
# OAuth2 client ID and set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET as real environment
# variables. Keeping this separate from application.properties means the app still
# starts up fine for anyone who hasn't set up Google login yet.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
