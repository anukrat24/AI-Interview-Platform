<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pricing · AI Interview Platform</title>
<th:block th:replace="~{fragments/head :: theme-head}"></th:block>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-3xl mx-auto px-6 py-10">
  <h1 class="text-2xl font-semibold mb-8 text-center">Choose your plan</h1>

  <div class="grid sm:grid-cols-2 gap-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <p class="text-lg font-semibold">Free</p>
      <p class="text-3xl font-bold mt-2">₹0</p>
      <ul class="text-sm text-slate-400 mt-4 space-y-2">
        <li>· A few mock interviews per day</li>
        <li>· Resume analyzer</li>
        <li>· Coding practice</li>
        <li>· AI roadmap generator</li>
      </ul>
    </div>

    <div class="bg-slate-900 border border-indigo-600 rounded-2xl p-6 relative">
      <span class="absolute -top-3 right-6 bg-indigo-600 text-xs px-2 py-1 rounded-full">Recommended</span>
      <p class="text-lg font-semibold">Premium</p>
      <p class="text-3xl font-bold mt-2">₹499<span class="text-sm text-slate-400 font-normal">/month</span></p>
      <ul class="text-sm text-slate-400 mt-4 space-y-2">
        <li>· Unlimited mock interviews</li>
        <li>· Priority AI response times</li>
        <li>· Everything in Free</li>
      </ul>
      <button id="upgradeBtn" class="w-full mt-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition font-medium">
        Upgrade to Premium
      </button>
      <p id="message" class="text-sm mt-3"></p>
    </div>
  </div>
</main>

<script>
  document.getElementById("upgradeBtn").addEventListener("click", async () => {
    const messageEl = document.getElementById("message");
    messageEl.textContent = "";

    try {
      const orderRes = await fetch("/api/payments/create-order", { method: "POST", credentials: "include" });
      if (orderRes.status === 401 || orderRes.status === 403) { window.location.href = "/login"; return; }
      const order = await orderRes.json();

      if (!orderRes.ok) {
        messageEl.textContent = order.message || "Could not start checkout";
        messageEl.className = "text-sm text-red-400";
        return;
      }

      const rzp = new Razorpay({
        key: order.razorpayKeyId,
        amount: order.amountPaise,
        currency: order.currency,
        order_id: order.orderId,
        name: "AI Interview Platform",
        description: "Premium subscription (30 days)",
        handler: async function (response) {
          const verifyRes = await fetch("/api/payments/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              razorpayOrderId: response.razorpay_order_id,
              razorpayPaymentId: response.razorpay_payment_id,
              razorpaySignature: response.razorpay_signature
            })
          });
          if (verifyRes.ok) {
            window.location.href = "/dashboard";
          } else {
            messageEl.textContent = "Payment verification failed. Contact support if you were charged.";
            messageEl.className = "text-sm text-red-400";
          }
        },
        theme: { color: "#4f46e5" }
      });
      rzp.open();
    } catch (err) {
      messageEl.textContent = "Network error. Please try again.";
      messageEl.className = "text-sm text-red-400";
    }
  });
</script>
</body>
</html>
