<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · AI Interview Platform</title>
<th:block th:replace="~{fragments/head :: theme-head}"></th:block>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-4xl mx-auto px-6 py-10 space-y-10">

  <section id="quotaBanner" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm rounded-xl px-4 py-3"></section>

  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
    <h2 class="text-xl font-semibold mb-4">Start a new mock interview</h2>
    <form id="startForm" class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-slate-300">Role</label>
        <select id="role" class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">
          <option>Java Developer</option>
          <option>Frontend Developer</option>
          <option>Full Stack</option>
          <option>DevOps</option>
          <option>Data Analyst</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-slate-300">Experience level</label>
        <select id="experienceLevel" class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">
          <option>Fresher</option>
          <option>1-3 years</option>
          <option>3-5 years</option>
          <option>5+ years</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-slate-300">Interview type</label>
        <select id="interviewType" class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">
          <option value="TECHNICAL">Technical</option>
          <option value="HR">HR</option>
          <option value="SYSTEM_DESIGN">System Design</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-slate-300"># of questions</label>
        <input type="number" id="numberOfQuestions" value="5" min="3" max="10"
               class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700" />
      </div>
      <div class="sm:col-span-2">
        <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition font-medium">
          Generate interview
        </button>
      </div>
    </form>
    <p id="startMessage" class="text-sm mt-3"></p>
  </section>

  <section class="grid sm:grid-cols-3 gap-4">
    <a href="/resume" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-indigo-600 transition">
      <p class="font-medium">Resume Analyzer</p>
      <p class="text-sm text-slate-400 mt-1">Get an ATS score and keyword gaps</p>
    </a>
    <a href="/coding" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-indigo-600 transition">
      <p class="font-medium">Coding Practice</p>
      <p class="text-sm text-slate-400 mt-1">Run code + get an AI review</p>
    </a>
    <a href="/roadmap" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-indigo-600 transition">
      <p class="font-medium">AI Roadmap</p>
      <p class="text-sm text-slate-400 mt-1">A study plan for your target role</p>
    </a>
  </section>

  <section>
    <h2 class="text-xl font-semibold mb-4">Your interview history</h2>
    <div id="historyList" class="space-y-3"></div>
  </section>
</main>

<script>
  const startForm = document.getElementById("startForm");
  const startMessage = document.getElementById("startMessage");
  const historyList = document.getElementById("historyList");
  const quotaBanner = document.getElementById("quotaBanner");

  async function loadMe() {
    const res = await fetch("/api/users/me", { credentials: "include" });
    if (!res.ok) return;
    const me = await res.json();
    if (me.subscriptionTier === "FREE") {
      const remaining = Math.max(0, me.freeInterviewsPerDay - me.interviewsUsedToday);
      quotaBanner.textContent = `Free plan: ${remaining} of ${me.freeInterviewsPerDay} interviews left today. `;
      const upgradeLink = document.createElement("a");
      upgradeLink.href = "/pricing";
      upgradeLink.className = "underline font-medium";
      upgradeLink.textContent = "Upgrade to Premium for unlimited.";
      quotaBanner.appendChild(upgradeLink);
      quotaBanner.classList.remove("hidden");
    }
  }

  async function loadHistory() {
    const res = await fetch("/api/interviews/history", { credentials: "include" });
    if (res.status === 401 || res.status === 403) { window.location.href = "/login"; return; }
    const items = await res.json();
    historyList.innerHTML = "";
    if (!items.length) {
      historyList.innerHTML = '<p class="text-slate-500 text-sm">No interviews yet. Start one above.</p>';
      return;
    }
    items.forEach((item) => {
      const div = document.createElement("a");
      div.href = "/interview/" + item.interviewId;
      div.className = "block bg-slate-900 border border-slate-800 rounded-xl p-4 hover:border-indigo-600 transition";
      div.innerHTML = `
        <div class="flex justify-between items-center">
          <div>
            <p class="font-medium">${item.role} · ${item.interviewType}</p>
            <p class="text-sm text-slate-400">${item.experienceLevel} · ${item.status}</p>
          </div>
          <p class="text-lg font-semibold">${item.overallScore != null ? item.overallScore + "/10" : "-"}</p>
        </div>`;
      historyList.appendChild(div);
    });
  }

  startForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    startMessage.textContent = "Generating questions with AI...";
    startMessage.className = "text-sm mt-3 text-amber-400";

    const payload = {
      role: document.getElementById("role").value,
      experienceLevel: document.getElementById("experienceLevel").value,
      interviewType: document.getElementById("interviewType").value,
      numberOfQuestions: parseInt(document.getElementById("numberOfQuestions").value, 10)
    };

    try {
      const res = await fetch("/api/interviews", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload)
      });
      if (res.status === 401 || res.status === 403) { window.location.href = "/login"; return; }
      const data = await res.json();
      if (res.ok) {
        window.location.href = "/interview/" + data.interviewId;
      } else {
        startMessage.textContent = data.message || "Could not start interview";
        startMessage.classList.replace("text-amber-400", "text-red-400");
      }
    } catch (err) {
      startMessage.textContent = "Network error. Please try again.";
      startMessage.classList.replace("text-amber-400", "text-red-400");
    }
  });

  loadMe();
  loadHistory();
</script>
</body>
</html>
