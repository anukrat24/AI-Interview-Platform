<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · AI Interview Platform</title>
<th:block th:replace="~{fragments/head :: theme-head}"></th:block>
<link rel="stylesheet" href="/css/login.css" />
</head>
<body>
<div class="cbl-page">

  <!-- Left: stat panel -->
  <div class="cbl-stat-panel">
    <div class="cbl-eyebrow">Day 42</div>
    <div>
      <div class="cbl-stat-number">02</div>
      <div class="cbl-stat-label">interviews completed<br />this week</div>
    </div>
    <div class="cbl-streak">streak: 6 days</div>
  </div>

  <!-- Right: form -->
  <div class="cbl-form-panel">
    <div class="cbl-form-inner">
      <div class="cbl-form-eyebrow">Returning talent</div>
      <h1 class="cbl-heading">Back in the room.</h1>
      <p class="cbl-subtext">Sign in to continue your mock interview prep.</p>

      <a href="/oauth2/authorization/google" class="cbl-btn-google">
        Continue with Google
      </a>

      <div class="cbl-divider">
        <div class="line"></div>
        <span>or</span>
        <div class="line"></div>
      </div>

      <form id="loginForm">
        <div class="cbl-field">
          <label class="cbl-label" for="email">Email</label>
          <input type="email" id="email" required class="cbl-input" placeholder="name@company.com" />
        </div>

        <div class="cbl-field">
          <label class="cbl-label" for="password">Password</label>
          <div class="cbl-input-wrap">
            <input type="password" id="password" required class="cbl-input" />
            <button type="button" id="togglePassword" class="cbl-toggle-pw" aria-label="Show password" aria-pressed="false">
              <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.61 3.63M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="otpBlock" class="cbl-field" style="display:none;">
          <label class="cbl-label" for="otp">OTP (check your email)</label>
          <input type="text" id="otp" class="cbl-input" />
        </div>

        <p id="message" class="cbl-message"></p>

        <button type="submit" class="cbl-btn-primary">
          Continue
        </button>
      </form>

      <div class="cbl-links">
        <a href="/register" class="cbl-link">Create account</a>
        <a href="/forgot-password" class="cbl-link-muted">Forgot password?</a>
      </div>

      <p class="cbl-mobile-footer">
        New here? <a href="/register" class="cbl-link">Create an account</a> instead.
      </p>
    </div>
  </div>
</div>

<script th:inline="javascript">
  // Surface OAuth failures redirected back with ?error=
  const params = new URLSearchParams(window.location.search);
  if (params.get("error") === "banned") {
    document.addEventListener("DOMContentLoaded", () => {
      const msg = document.getElementById("message");
      msg.textContent = "This account has been suspended.";
      msg.classList.add("is-error");
    });
  } else if (params.get("error") === "oauth") {
    document.addEventListener("DOMContentLoaded", () => {
      const msg = document.getElementById("message");
      msg.textContent = "Google sign-in failed. Please try again.";
      msg.classList.add("is-error");
    });
  }

  const form = document.getElementById("loginForm");
  const messageEl = document.getElementById("message");
  const otpBlock = document.getElementById("otpBlock");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageEl.textContent = "";
    messageEl.className = "cbl-message";

    const payload = {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
      otp: document.getElementById("otp").value || null
    };

    try {
      const res = await fetch("/api/users/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.token) {
        window.location.href = "/dashboard";
        return;
      }

      messageEl.textContent = data.message || "Something went wrong";
      const isOtpStep = data.message && data.message.toLowerCase().includes("otp sent");
      messageEl.classList.add(isOtpStep ? "is-warning" : "is-error");
      if (data.message && data.message.toLowerCase().includes("otp")) {
        otpBlock.style.display = "block";
      }
    } catch (err) {
      messageEl.textContent = "Network error. Please try again.";
      messageEl.classList.add("is-error");
    }
  });

  // Show/hide password
  const toggleBtn = document.getElementById("togglePassword");
  const passwordInput = document.getElementById("password");
  toggleBtn.addEventListener("click", () => {
    const isVisible = passwordInput.type === "text";
    passwordInput.type = isVisible ? "password" : "text";
    toggleBtn.classList.toggle("is-visible", !isVisible);
    toggleBtn.setAttribute("aria-pressed", String(!isVisible));
    toggleBtn.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
  });
</script>
</body>
</html>
