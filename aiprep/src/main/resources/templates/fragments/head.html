<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="theme-head">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // "Green Room" palette: remap Tailwind's built-in slate/indigo/amber/emerald/red
  // scales to our theme, so every page that already uses those utility classes
  // (bg-slate-950, text-indigo-400, etc.) picks up the new identity automatically.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: {
            50:  '#F4F2EA',
            100: '#EDEAE0',
            200: '#C7D3CD',
            300: '#B9C7C1',
            400: '#9BB0A9',
            500: '#7E948C',
            700: '#2C3835',
            800: '#212C29',
            900: '#1A2321',
            950: '#0F1513'
          },
          indigo: {
            300: '#8ED1AA',
            400: '#63BE8B',
            500: '#3C8F63',
            600: '#2F7A54'
          },
          amber: {
            300: '#EACB8B',
            400: '#DDBB68',
            500: '#C9A24B'
          },
          emerald: { 400: '#63BE8B' },
          red:     { 400: '#D9695F' }
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          serif: ['Fraunces', 'ui-serif', 'Georgia'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="/css/theme.css" />
</th:block>
