<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="theme-head">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // "Confidence Block" palette: remap Tailwind's built-in slate/indigo/amber/emerald/red
  // scales to our theme, so every page that already uses those utility classes
  // (bg-slate-950, text-indigo-400, etc.) picks up the new identity automatically.
  // slate = neutral ink surfaces, indigo = primary accent (lime), amber = premium gold
  // (unchanged), emerald = true-green success state (kept distinct from the lime accent
  // so "success" and "primary action" stay visually different), red = danger/error.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: {
            50:  '#F7F7F5',
            100: '#F2F2F0',
            200: '#D8D8D5',
            300: '#B5B5B0',
            400: '#8A8A87',
            500: '#6A6A67',
            700: '#3A3A38',
            800: '#242423',
            900: '#1F1F1E',
            950: '#161616'
          },
          indigo: {
            300: '#DCF07A',
            400: '#C6EA3E',
            500: '#CDEE55',
            600: '#B8DE2E'
          },
          amber: {
            300: '#EACB8B',
            400: '#DDBB68',
            500: '#C9A24B'
          },
          emerald: { 400: '#4ADE80', 500: '#22C55E', 600: '#16A34A' },
          red:     { 400: '#F09595' }
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          serif: ['Fraunces', 'ui-serif', 'Georgia'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="/css/theme.css" />
</th:block>
