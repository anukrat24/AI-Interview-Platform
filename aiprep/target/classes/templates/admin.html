<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel · AI Interview Platform</title>
<th:block th:replace="~{fragments/head :: theme-head}"></th:block>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-5xl mx-auto px-6 py-10 space-y-10">
  <h1 class="text-2xl font-semibold">Admin Panel</h1>

  <section id="analyticsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></section>

  <section>
    <h2 class="text-xl font-semibold mb-4">Users</h2>
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-800 text-slate-400 text-left">
          <tr>
            <th class="px-4 py-3">Name</th>
            <th class="px-4 py-3">Email</th>
            <th class="px-4 py-3">Role</th>
            <th class="px-4 py-3">Plan</th>
            <th class="px-4 py-3">Interviews</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  async function checkAdmin() {
    const res = await fetch("/api/users/me", { credentials: "include" });
    if (!res.ok) { window.location.href = "/login"; return false; }
    const me = await res.json();
    if (me.role !== "ADMIN") { window.location.href = "/dashboard"; return false; }
    return true;
  }

  async function loadAnalytics() {
    const res = await fetch("/api/admin/analytics", { credentials: "include" });
    if (!res.ok) return;
    const a = await res.json();
    const grid = document.getElementById("analyticsGrid");
    const cards = [
      ["Total users", a.totalUsers],
      ["Interviews taken", a.totalInterviews],
      ["Premium users", a.totalPremiumUsers],
      ["Resumes analyzed", a.totalResumesAnalyzed],
      ["Coding submissions", a.totalCodingSubmissions],
      ["Avg. interview score", a.averageInterviewScore + "/10"]
    ];
    grid.innerHTML = cards.map(([label, value]) => `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-xs text-slate-400">${label}</p>
        <p class="text-2xl font-semibold mt-1">${value}</p>
      </div>`).join("");
  }

  async function loadUsers() {
    const res = await fetch("/api/admin/users", { credentials: "include" });
    if (!res.ok) return;
    const users = await res.json();
    const body = document.getElementById("usersBody");
    body.innerHTML = users.map(u => `
      <tr class="border-t border-slate-800">
        <td class="px-4 py-3">${u.name}</td>
        <td class="px-4 py-3">${u.email}</td>
        <td class="px-4 py-3">${u.role}</td>
        <td class="px-4 py-3">${u.subscriptionTier}</td>
        <td class="px-4 py-3">${u.totalInterviews}</td>
        <td class="px-4 py-3">${u.banned ? '<span class="text-red-400">Banned</span>' : '<span class="text-emerald-400">Active</span>'}</td>
        <td class="px-4 py-3">
          <button data-id="${u.id}" data-action="${u.banned ? "unban" : "ban"}" class="banBtn text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700">
            ${u.banned ? "Unban" : "Ban"}
          </button>
        </td>
      </tr>`).join("");

    document.querySelectorAll(".banBtn").forEach(btn => {
      btn.addEventListener("click", async () => {
        await fetch(`/api/admin/users/${btn.dataset.id}/${btn.dataset.action}`, { method: "POST", credentials: "include" });
        loadUsers();
      });
    });
  }

  (async () => {
    if (await checkAdmin()) {
      loadAnalytics();
      loadUsers();
    }
  })();
</script>
</body>
</html>
