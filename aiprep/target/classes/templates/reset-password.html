<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password · AI Interview Platform</title>
<th:block th:replace="~{fragments/head :: theme-head}"></th:block>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
<div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
  <h1 class="text-2xl font-semibold mb-1">Set a new password</h1>
  <p class="text-slate-400 text-sm mb-6">Choose a new password for your account.</p>

  <form id="resetForm" class="space-y-4">
    <div>
      <label class="text-sm text-slate-300">New password (min 8 characters)</label>
      <input type="password" id="newPassword" required minlength="8"
             class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>
    <p id="message" class="text-sm"></p>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition font-medium">
      Reset password
    </button>
  </form>
</div>

<script>
  const token = new URLSearchParams(window.location.search).get("token");
  const messageEl = document.getElementById("message");

  if (!token) {
    messageEl.textContent = "Missing or invalid reset link.";
    messageEl.className = "text-sm text-red-400";
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch("/api/users/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword: document.getElementById("newPassword").value })
    });
    const data = await res.json();
    messageEl.textContent = data.message;
    messageEl.className = "text-sm " + (res.ok ? "text-emerald-400" : "text-red-400");
    if (res.ok) setTimeout(() => (window.location.href = "/login"), 1200);
  });
</script>
</body>
</html>
