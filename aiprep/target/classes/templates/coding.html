<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coding Practice · AI Interview Platform</title>
<th:block th:replace="~{fragments/head :: theme-head}"></th:block>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-3xl mx-auto px-6 py-10 space-y-6">
  <h1 class="text-2xl font-semibold">Coding Interview Practice</h1>
  <p class="text-slate-400 text-sm">Write code, run it in a sandboxed environment, and get an AI code review like an interviewer would give.</p>

  <form id="codeForm" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-slate-300">Problem title (optional)</label>
        <input type="text" id="problemTitle" placeholder="e.g. Reverse a linked list"
               class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700" />
      </div>
      <div>
        <label class="text-sm text-slate-300">Language</label>
        <select id="language" class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">
          <option value="java">Java</option>
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="cpp">C++</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-sm text-slate-300">Code</label>
      <textarea id="sourceCode" rows="14" spellcheck="false"
        class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 font-mono text-sm"
        placeholder="public class Main { public static void main(String[] args) { System.out.println(&quot;Hello&quot;); } }"></textarea>
    </div>
    <div>
      <label class="text-sm text-slate-300">Stdin input (optional)</label>
      <textarea id="stdinInput" rows="2"
        class="w-full mt-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 font-mono text-sm"></textarea>
    </div>
    <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition font-medium">
      Run & review
    </button>
    <p id="message" class="text-sm"></p>
  </form>

  <div id="result" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4"></div>
</main>

<script>
  const form = document.getElementById("codeForm");
  const messageEl = document.getElementById("message");
  const resultEl = document.getElementById("result");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    messageEl.textContent = "Running your code and generating an AI review...";
    messageEl.className = "text-sm text-amber-400";
    resultEl.classList.add("hidden");

    const payload = {
      language: document.getElementById("language").value,
      sourceCode: document.getElementById("sourceCode").value,
      stdinInput: document.getElementById("stdinInput").value,
      problemTitle: document.getElementById("problemTitle").value
    };

    try {
      const res = await fetch("/api/coding/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify(payload)
      });
      if (res.status === 401 || res.status === 403) { window.location.href = "/login"; return; }
      const data = await res.json();

      if (!res.ok) {
        messageEl.textContent = data.message || "Could not run code";
        messageEl.className = "text-sm text-red-400";
        return;
      }

      messageEl.textContent = "";
      resultEl.classList.remove("hidden");
      resultEl.innerHTML = `
        <div>
          <p class="font-medium text-sm mb-1 ${data.success ? "text-emerald-400" : "text-red-400"}">
            ${data.success ? "✓ Ran successfully" : "✗ Execution failed"}
          </p>
          <pre class="text-sm bg-slate-950 border border-slate-800 rounded-lg p-3 whitespace-pre-wrap">${escapeHtml(data.output)}</pre>
        </div>
        <div>
          <p class="font-medium text-sm mb-1">AI code review</p>
          <p class="text-sm text-slate-300 whitespace-pre-wrap">${escapeHtml(data.aiReview)}</p>
        </div>
      `;
    } catch (err) {
      messageEl.textContent = "Network error. Please try again.";
      messageEl.className = "text-sm text-red-400";
    }
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
</script>
</body>
</html>
